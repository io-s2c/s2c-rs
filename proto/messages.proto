syntax = "proto3";

package io.s2c.model;

import "state.proto";

message S2CMessage {
  string correlation_id = 1;

  oneof body {
    StateRequest state_request = 2;
    StateRequestResponse state_request_response = 3;
    ReplicateRequest replicate_request = 4;
    ReplicateResponse replicate_response = 5;

    Follow follow =  6;
    FollowResponse follow_response = 7;
    Handshake handshake = 8;
  }

  oneof error {
    NotLeaderError not_leader_error = 9;
    LeaderStartingError leader_starting_error = 10;
    NotFollowerError not_follower_error = 11;
    SlowDownError slow_down_error = 12;
    InternalError internal_error = 13;
    UnknownGroupError unknown_group_error = 14;
  }
}

message Handshake {
  string groupId = 1;
  NodeIdentity node_identity = 2;
}

message InternalStateRequest {
  oneof body {
    S2CGroupStatusRequest group_status_request = 1;
  }
}

message StateRequest {
  bytes body = 1;
  StateRequestType type = 2;
  string group_id = 3;
  bool internal = 4;
  bool leader_command = 5;

  enum StateRequestType {
    COMMAND = 0;
    READ = 1;
  }
}

message StateRequestResponse {
  oneof body {
    ApplicationResult application_result = 1;
  }
}

message S2CGroupStatusRequest {
}

message ApplicationResult {
  bytes body = 1;
}

message FollowResponse {
}

message Follow {
  uint64 apply_index = 1;
  NodeIdentity node_identity = 2;
  string group_id = 3;
}

message ReplicateResponse {
  uint64 apply_index = 1;
}

message ReplicateRequest {
  bytes log_entry = 1;
  FollowerTooFarBehindError follower_too_far_behind_error = 2;
}

message InternalError {

}

message NotLeaderError {

}

message LeaderStartingError {

}

message NotFollowerError {

}

message SlowDownError {

}

message FollowerTooFarBehindError {

}

message UnknownGroupError {

}