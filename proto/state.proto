syntax = "proto3";

package io.s2c.model;

message Snapshot {
	uint64 at_apply_index = 1;
	uint64 leader_epoch = 2;
  bytes body = 3;
}

message NodeIdentity {
  string id = 1;
  string address = 2;
  int32 port = 3;
  string az = 4;
}

message BatchEntry {
  bytes body = 1;
  bool internal = 2;
}

message Batch {
  repeated BatchEntry entries = 1;
}

message LogEntry {
  Batch batch = 1;
  LeaderState leader_state = 2;
}

message FollowerInfo {
  NodeIdentity node_identity = 1;
  uint64 replicated_apply_index = 2;
}

message LeaderState {
  uint64 epoch = 1;
  uint64 commit_index = 2;
  NodeIdentity node_identity = 3;
}

message S2CGroupStatus {
  NodeIdentity leader_node_identity = 1;
  uint64 epoch = 2;
  uint64 commit_index = 3;
  uint64 leaders_apply_index = 4;
  repeated FollowerInfo followers = 5;
}
