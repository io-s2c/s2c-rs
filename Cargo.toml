[package]
name = "s2c"
version = "0.1.0"
edition = "2024"

[lib]
name = "s2c"
path = "src/lib.rs"

[dependencies]
prost = "0.14.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.29"
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["v4"] }
tokio-util = { version = "0.7.18", features = ["full"] }
rand = "0.10.1"

[build-dependencies]
prost-build = "0.14.3"
pbjson-build = "0.9.0"
