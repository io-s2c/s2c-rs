[package]
name = "s2c"
version = "0.1.0"
edition = "2024"

[lib]
name = "s2c"
path = "src/lib.rs"

[dependencies]
prost = "0.14.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
moka = {version = "0.12", features = ["sync"]}
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["v4"] }
tokio-util = { version = "0.7.18", features = ["full"] }
rand = "0.10.1"
object_store = "0.14.0"
async-trait = "0.1.89"
futures = "0.3.33"
tokio-stream = "0.1.19"
log = "0.4.35"

[build-dependencies]
prost-build = "0.14.3"
